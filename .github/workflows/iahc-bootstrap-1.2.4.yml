name: Bootstrap iahc 1.2.4 release
on:
  push:
    paths:
      - ".github/workflows/iahc-bootstrap-1.2.4.yml"
permissions:
  contents: write
  actions: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag and dispatch existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="iahc-1.2.4"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' --silent 2>/dev/null || true)"
          if [[ "${current}" == *"Not Found"* ]]; then current=""; fi
          if [[ -n "${current}" && "${current}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${tag} exists at ${current}, expected ${GITHUB_SHA}"
            exit 1
          fi
          if [[ -z "${current}" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
          fi
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "release_tag=${tag}"
