name: Bootstrap iahc 1.2.16 release
on:
  push:
    paths:
      - ".github/workflows/iahc-bootstrap-1.2.16.yml"
permissions:
  contents: write
  actions: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified tag and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=iahc-1.2.16
          # Pin the actual reviewed and merged source, not this temporary workflow commit.
          target_sha=c1990f2b3ccf10d49dda4da94dd08357bd3daa2e
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
          # A 404 response may be emitted as a JSON object instead of an empty string.
          if [[ "${existing}" == *'"status":"404"'* || "${existing}" == *'Not Found'* ]]; then
            existing=""
          fi
          if [[ -n "${existing}" && "${existing}" != "${target_sha}" ]]; then
            echo "::error::Release tag already points to a different commit: ${existing}"
            exit 1
          fi
          if [[ -z "${existing}" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${target_sha}"
          fi
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "release_tag=${tag}"
